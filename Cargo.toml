[workspace]
resolver = "2"
members = [
    "crates/nyanyabot",
    "crates/nyanyabot-plugin-builtin-status",
    "crates/nyanyabot-plugin-echo",
    "crates/nyanyabot-plugin-cron",
    "crates/nyanyabot-plugin-configdump",
    "crates/xtask",
]
default-members = ["crates/nyanyabot"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
nyanyabot-proto = { path = "../nyanyabot-proto" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
cron = "0.15"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
mime_guess = "2"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.12", features = ["transport"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
parking_lot = "0.12"
dashmap = "6"
subtle = "2"
url = "2"
tempfile = "3"
