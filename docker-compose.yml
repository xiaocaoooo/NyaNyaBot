services:
  nyanyabot:
    build:
      context: ..
      dockerfile: NyaNyaBot/Dockerfile
    image: nyanyabot:rewrite-smoke
    container_name: nyanyabot-rewrite-smoke
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins
    restart: unless-stopped
